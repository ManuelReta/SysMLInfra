name: Publish SysML Model to API

on:
  push:
    branches:
      - main
    paths:
      - "**.sysml"
  pull_request:
    branches:
      - main
jobs:
  publish:
    name: publish-to-api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build and start the docker-compose services
        env:
          CERT_PATH: ${{ github.workspace }}/dummy.cer
        run: docker compose up sysmldb sysml_v2_pilot_api --build --detach
      
      - uses: conda-incubator/setup-miniconda@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install sysML v2 kernel
        shell: bash -l {0}
        env:
          API_BASE: http://localhost:9000
        run: conda info --envs && bash setup.sh

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: sync
        run: uv sync --all-groups

      - name: dummy-certs
        run: touch ${{ github.workspace }}/dummy.cer 

      - name: Publish model to SysML v2 API
        env:
          API_BASE: http://localhost:9000
        run: bash commit.sh

      - name: Verify API persistence and constraints
        env:
          API_BASE: http://localhost:9000
        run: uv run python -m sys_infra.entry verify --publish
      - name: Run integration tests
        run: uv run python -m pytest -m integration

      - name: Upload publish state artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sysml-api-publish-state
          path: |
            lib/commit-ids.json
            lib/current-project-id.txt
          retention-days: 90
