name: Validate SysML Model

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        run: uv python install

      - name: Run unit tests
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: uv run pytest tests/ -x --tb=short -q -m "not integration and not sysmlkernel" --no-docker --cov=. --cov-report=term
  
  linting:
    name: Linting (mypy and ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        run: uv python install
        
      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Mypy type checking
        run: uv run pre-commit run mypy  

      - name: Ruff format (check)
        run: uvx ruff format --check --exclude "**/*.ipynb"
      - name: Ruff lint (check)
        run: uvx ruff check --output-format=github --exclude "**/*.ipynb"

  validate-sysml:
    name: validate-sysml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SysML kernel and API
        uses: ./.github/actions/install-sysml-kernel

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: sync
        run: uv sync --all-groups

      - name: Run SysML v2 kernel validation
        shell: bash -el {0}
        env: 
          REPO_ROOT: ${{ github.workspace }}
        run: uv run python -m scripts.ci_kernel_validate
      
      - name: Verify manifest and layer files (dry run)
        env: 
          REPO_ROOT: ${{ github.workspace }}
        run: uv run python -m sys_infra.entry validate --dry-run
