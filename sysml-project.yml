# =============================================================================
# sysml-project.yml — SysML v2 project manifest
#
# Two keys are consumed by the tooling:
#
#   layers            — COMPLETE layer list in strict import order.
#                       Used by commit.sh (POST to API) and ci_kernel_validate.py
#                       --dry-run (file-existence check).
#                       Imported-by-nothing must come first (RAAML has no imports).
#
#   validation_layers — POSITIVE-TEST subset for kernel execution in CI.
#                       Used by ci_kernel_validate.py (full kernel run).
#                       Must exclude any layer whose analysis def blocks contain
#                       intentional VIOLATED assertions (negative tests).
#                       FMEA.sysml and UQ.sysml are excluded here — they are
#                       validated separately by examples/bilgepump/Safety.ipynb.
#                       Omit this key to run all layers (may produce expected failures).
#
# To adapt for a new project: change 'name', 'description', and both lists.
# =============================================================================

name: BilgePumpSystem
description: "SysML v2 bilge pump verification — IMO MARPOL, DNV, IEC 60945, SOLAS"

# All 7 layers — full model including safety, FMEA, and state machine extensions.
# RAAML folded into Requirements.sysml (render-only provenance); UQ folded into
# Analysis.sysml (worst-case margin probe). Neither is a standalone layer.
layers:
  - examples/bilgepump/Library.sysml
  - examples/bilgepump/Architecture.sysml
  - examples/bilgepump/Requirements.sysml
  - examples/bilgepump/Analysis.sysml
  - examples/bilgepump/Safety.sysml
  - examples/bilgepump/FMEA.sysml
  - examples/bilgepump/StateMachine.sysml

# Positive-test subset for kernel CI execution.
# FMEA.sysml: contains 4 negative-test analysis defs — designed to produce
#             VIOLATED assertions (FM-S-001, FM-PA-002, FM-PB-001, FM-C-001).
#             Syntax-validated via --dry-run, excluded from the positive subset.
# StateMachine.sysml: no VIOLATED assertions; included in validation.
validation_layers:
  - examples/bilgepump/Library.sysml
  - examples/bilgepump/Architecture.sysml
  - examples/bilgepump/Requirements.sysml
  - examples/bilgepump/Analysis.sysml
  - examples/bilgepump/Safety.sysml
  - examples/bilgepump/StateMachine.sysml

# Z3 formal analysis layer (not executed by the SysML kernel — Python only).
# Run with: python verify.py --z3
# Or standalone: python examples/bilgepump/formal_analysis.py
# Six levels of increasing complexity:
#   L1  Symbolic baseline (LRA) — REQ-001 proof by refutation
#   L2  Efficiency floor (NRA)  — discover REQ-004 vs FT-002 gap
#   L3  Accuracy envelope (LRA) — find MARPOL boundary for FT-001/FT-003
#   L4  Response window (LRA)   — critical inflow for FT-004 timing chain
#   L5  Adversarial (NRA)       — REQ-001..006 pass, FT-002 still violated
#   L6  Bounded temporal (LIA)  — override ordering in state machine (depth≤8)
z3_layers:
  - examples/bilgepump/formal_analysis.py
