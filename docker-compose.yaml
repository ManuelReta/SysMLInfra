# Base stack: postgres + pgAdmin + the SysML v2 pilot API.
# This file is CI-safe on its own: no secrets and no persistent volume, so a
# fresh, ephemeral database is created every run. Compose it with overlays:
#   docker compose -f docker-compose.yaml -f docker-compose-local.yaml up        # DNV/Zscaler proxy
#   docker compose -f docker-compose.yaml ... -f docker-compose.persist.yaml up  # persistent local
services:
  sysmldb:
    image: postgres
    container_name: sysml2-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sysml2
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_USER=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: my-pgadmin
    ports:
      - "8090:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=YourSecurePassword
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - ./docker-servers.json:/pgadmin4/servers.json
    depends_on:
      - sysmldb

  sysml_v2_pilot_api:
    environment:
      - PLAY_HTTP_SECRET_KEY=change-this-to-a-long-random-string-at-least-32-chars
    build:
      context: .
      dockerfile: Dockerfile_pilot_api
    volumes:
      # Runtime-mounted persistence config so the DDL mode (hbm2ddl.auto) can be
      # changed without rebuilding the image. See patches/persistence.xml.
      - ./patches/persistence.xml:/app/conf/META-INF/persistence.xml
    command: >
      bash -c "
      target/universal/stage/bin/sysml-v2-api-services
      "
    ports:
      - "9000:9000"
    depends_on:
      sysmldb:
        condition: service_healthy

  