[project]
name = "sysmlinfra"
version = "0.1.0"
description = "SysML v2 infrastructure python package"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "jupyter-client>=8.9.0",
    "jupyter-console>=6.6.3",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "pytest-cov>=7.0.0",
    "types-requests>=2.33.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sys_infra"]

[project.scripts]
commit = "sys_infra.commit:main"
