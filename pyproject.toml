[project]
name = "sysmlinfra"
version = "0.1.0"
description = "SysML v2 infrastructure python package"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "jupyter-client>=8.9.0",
    "jupyter-console>=6.6.3",
    "matplotlib>=3.10.9",
    "nbclient>=0.11.0",
    "nbconvert>=7.16.0",
    "nbformat>=5.10.4",
    "networkx>=3.6.1",
    "opcua>=0.98.13",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "z3-solver>=4.16.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "pytest-cov>=7.0.0",
    "types-requests>=2.33.0.20260518",
    "types-networkx>=3.6.1.20260518",
    "types-paho-mqtt>=1.6.0.20240321",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sys_infra", "resolver"]

[project.scripts]
commit = "sys_infra.commit:main"
