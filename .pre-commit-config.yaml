repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.14.14
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
      exclude: '.*ipynb$'
    # Run the formatter.
    - id: ruff-format
      exclude: '.*ipynb$'

- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 0.9.28
  hooks:
    - id: uv-lock


- repo: local
  hooks:
    - id: mypy
      name: Mypy (uv)
      entry: uv run mypy
      language: system
      types: [python]
      args: [--ignore-missing-imports]

