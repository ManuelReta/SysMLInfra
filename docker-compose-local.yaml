services:
  pgadmin:
    extends: docker-compose.yaml
    environment:
      - REQUESTS_CA_BUNDLE=/run/secrets/zscaler
      - SSL_CERT_FILE=/run/secrets/zscaler
    secrets:
      - zscaler

  sysml_v2_pilot_api:
    extends: docker-compose.yaml
    build:
      secrets:
        - zscaler

secrets:
  zscaler:
    file: ${CERT_PATH}
